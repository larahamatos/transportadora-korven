<div class="driver" id="app">

    <header class="d-top">
        <a class="mark" href="#/" aria-label="Korven, início">
            <img src="../Logotipo%20K%20com%20Estrada%20Neon%20(2).png" alt="">
        </a>

        <div class="hello">
            <small id="saudacao"></small>
            <strong id="nome"></strong>
        </div>

        <div class="user" id="user">
            <button class="user-btn" id="user-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Menu da conta">
                <span class="avatar" id="avatar"></span>
            </button>
            <div class="user-menu" id="user-menu" role="menu" hidden>
                <a role="menuitem" href="#/perfil" id="um-perfil"></a>
                <button role="menuitem" type="button" id="sair"></button>
            </div>
        </div>
    </header>

    <main class="view" id="view" tabindex="-1"></main>

    <nav class="tabbar" id="tabbar" aria-label="Navegação do motorista">
        <span class="ind" id="ind" aria-hidden="true"></span>
    </nav>
</div>
