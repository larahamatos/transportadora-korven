<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Histórico e rastreamento — Korven Sistema</title>
<link rel="icon" href="../Logotipo K com Estrada Neon (2).png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Unbounded:wght@400;700;900&display=swap">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/componentes.css">
<link rel="stylesheet" href="assets/css/ui.css">
<link rel="stylesheet" href="assets/css/paginas/historico-entrega.css">
</head>
<body class="app">

<div class="bg" id="bg" aria-hidden="true">
    <div class="bg-l" data-k="0.03"></div>
    <div class="bg-l" data-k="0.07"></div>
    <div class="bg-l" data-k="0.13"></div>
</div>

<aside class="side">
    <a class="side-logo" href="index.html#/" aria-label="Korven — início">
        <img src="../Logotipo K com Estrada Neon (2).png" alt="">
    </a>
    <nav id="nav" aria-label="Menu do sistema"></nav>
</aside>

<div class="main">

<header class="top">
    <a class="top-logo" href="index.html#/" aria-label="Korven"><img src="../Logotipo K com Estrada Neon (2).png" alt=""></a>
    <ol class="crumbs" aria-label="Você está em">
        <li><a href="index.html#/entregas">Entregas</a></li>
        <li>Histórico</li>
        <li aria-current="page" id="crumb-code">—</li>
    </ol>
    <form class="top-search" id="hs-form" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
        <input id="hs-input" aria-label="Buscar entrega pelo código de rastreio" placeholder="Código de rastreio" autocomplete="off" spellcheck="false">
        <kbd aria-hidden="true">/</kbd>
    </form>
    <a class="top-user" id="avatar" href="index.html#/perfil" aria-label="Meu perfil">—</a>
</header>

<main class="page">

<div class="page-head">
    <div>
        <p class="eyebrow">Entregas</p>
        <h1>Histórico e <em>rastreamento</em></h1>
    </div>
    <div class="dv-list" id="dv-list" role="group" aria-label="Entregas recentes"></div>
</div>

<div class="cols">

<aside class="sum" id="sum" aria-label="Resumo da entrega">

    <div class="sum-id">
        <div class="sum-top">
            <strong class="sum-code" id="s-code">—</strong>
            <span class="chip" id="s-chip" data-s="transit">—</span>
        </div>
        <p class="sum-to" id="s-dest">—</p>
        <p class="sum-ped" id="s-ped">—</p>
    </div>

    <div class="rt">
        <div class="rt-ends"><span id="rt-from">—</span><span id="rt-to">—</span></div>
        <div class="rt-line" id="rt-line" aria-hidden="true">
            <div class="rt-bar"></div>
            <ol class="rt-steps" id="rt-steps"></ol>
        </div>
        <p class="rt-info" id="rt-info">—</p>
    </div>

    <dl class="met">
        <div><dt>Solicitada em</dt><dd id="s-sol">—</dd></div>
        <div><dt id="s-prev-l">Previsão</dt><dd id="s-prev">—</dd></div>
    </dl>

    <p class="sla" id="s-sla" data-s="ok"><i></i><span>—</span></p>

    <details class="load">
        <summary>Carga · <span id="s-load">—</span></summary>
        <ul id="s-items"></ul>
    </details>

    <div class="acts">
        <button class="btn" id="b-play" type="button">Reproduzir</button>
        <button class="btn ghost" id="b-now" type="button">Status atual</button>
    </div>
</aside>

<section class="fio" id="fio" aria-labelledby="fio-t">
    <h2 class="sr" id="fio-t">Linha do tempo da entrega</h2>
    <svg class="fio-svg" id="fio-svg" aria-hidden="true" focusable="false"></svg>
    <ol class="fio-list" id="fio-list"></ol>
    <noscript><p>Ative o JavaScript para ver o histórico da entrega.</p></noscript>
</section>

</div>
</main>
</div>

<nav class="tabbar" id="tabbar" aria-label="Menu"></nav>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="assets/js/core/dom.js"></script>
<script src="assets/js/core/formato.js"></script>
<script src="assets/js/core/env.js"></script>
<script src="assets/js/core/config.js"></script>
<script src="assets/js/core/status.js"></script>
<script src="assets/js/core/sessao.js"></script>
<script src="assets/js/core/menu.js"></script>
<script src="assets/js/componentes/aviso.js"></script>
<script src="assets/js/componentes/fundo.js"></script>
<script src="assets/js/api/entregas.js"></script>
<script src="assets/js/paginas/historico-entrega/modelo.js"></script>
<script src="assets/js/paginas/historico-entrega/resumo.js"></script>
<script src="assets/js/paginas/historico-entrega/linha-do-tempo.js"></script>
<script src="assets/js/paginas/historico-entrega/index.js"></script>
</body>
</html>
