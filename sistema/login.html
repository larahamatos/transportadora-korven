<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Entrar — Korven</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Unbounded:wght@700;900&display=swap">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
<div class="login">

    <section class="login-art" aria-hidden="true">
        <a class="logo" href="../Korven%20%E2%80%94%20Log%C3%ADstica%20em%20movimento.html" tabindex="-1">
            <img src="../Logotipo%20K%20com%20Estrada%20Neon%20(2).png" alt="">
            <span>ORVEN</span>
        </a>

        <svg class="art-map" viewBox="0 0 600 420" preserveAspectRatio="xMidYMid slice">
            <g stroke="#ffffff" stroke-opacity=".12" fill="none">
                <path d="M0 320 C120 260 200 360 330 300 S520 220 600 270"/>
                <path d="M0 110 C130 150 230 60 390 100 S540 60 600 80"/>
            </g>
            <path id="rota" class="route" d="M40 330 C130 130 230 350 320 210 S500 70 570 130"/>
            <g fill="#C6FF00"><circle cx="40" cy="330" r="8"/><circle cx="320" cy="210" r="6"/><circle cx="570" cy="130" r="8"/></g>
            <circle class="pulse" r="12" fill="#C6FF00"><animateMotion dur="8s" repeatCount="indefinite"><mpath href="#rota"/></animateMotion></circle>
            <circle r="8" fill="#C6FF00" stroke="#000" stroke-width="3"><animateMotion dur="8s" repeatCount="indefinite"><mpath href="#rota"/></animateMotion></circle>
        </svg>

        <div class="art-copy">
            <h1>Sua carga, <em>sempre</em> à frente.</h1>
            <p>Acompanhe entregas, motoristas e integrações em um só lugar.</p>
        </div>
    </section>

    <section class="login-panel">
        <div class="card" id="card">
            <a class="logo mobile-logo" href="../Korven%20%E2%80%94%20Log%C3%ADstica%20em%20movimento.html" aria-label="Korven, voltar ao site">
                <img src="../Logotipo%20K%20com%20Estrada%20Neon%20(2).png" alt="">
                <span>ORVEN</span>
            </a>

            <h2 id="titulo">Entrar no sistema</h2>
            <p class="sub" id="sub">Use o e-mail e a senha da sua conta Korven.</p>

            <form id="form" novalidate>
                <div class="field">
                    <label for="email">E-mail</label>
                    <input id="email" name="email" type="email" inputmode="email" autocomplete="username" placeholder="voce@empresa.com" required>
                </div>

                <div class="field" id="campo-senha">
                    <label for="senha">Senha</label>
                    <div class="pw">
                        <input id="senha" name="senha" type="password" autocomplete="current-password" placeholder="Sua senha" required>
                        <button class="eye" type="button" id="ver" aria-label="Mostrar senha" aria-pressed="false"></button>
                    </div>
                </div>

                <div class="row" id="linha-opcoes">
                    <label class="check"><input type="checkbox" id="manter"><span>Manter conectado</span></label>
                    <button class="link" type="button" id="esqueci">Esqueci a senha</button>
                </div>

                <div class="msg" id="msg" role="alert" aria-live="polite"></div>

                <button class="btn" type="submit" id="enviar"><span class="spin"></span><span id="enviar-txt">Entrar</span></button>
                <button class="link back" type="button" id="voltar" hidden>Voltar ao login</button>
            </form>

            <!-- Atalhos do mock. Remover junto com assets/js/mock/ quando o Supabase entrar. -->
            <div class="demo" id="demo">
                <p>Acesso de demonstração</p>
                <div class="chips">
                    <button type="button" data-email="admin@korven.com" data-senha="admin123">Admin</button>
                    <button type="button" data-email="operador@korven.com" data-senha="operador123">Operador</button>
                    <button type="button" data-email="motorista@korven.com" data-senha="motorista123">Motorista</button>
                    <button type="button" data-email="cliente@korven.com" data-senha="cliente123">Cliente</button>
                </div>
            </div>

            <a class="site" href="../Korven%20%E2%80%94%20Log%C3%ADstica%20em%20movimento.html"></a>
        </div>
    </section>

</div>

<script src="assets/js/icons.js"></script>
<script src="assets/js/mock/usuarios.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/login.js"></script>
</body>
</html>
